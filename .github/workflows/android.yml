name: Compilar y publicar APK Control Remoto L
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK de Android
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "No se encontró Android SDK Manager"; exit 1; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generar APK de prueba
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Guardar APK con nombre sencillo
        run: cp app/build/outputs/apk/debug/app-debug.apk ControlRemotoL-v1.2.apk
      - name: Publicar APK descargable
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: ControlRemotoL-v1.2.apk
          archive: false
      - name: Publicar versión en Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.2.0-beta ControlRemotoL-v1.2.apk \
            --title "Control Remoto L 1.2 beta" \
            --notes "Samsung: movimiento sin enviar clic ni ENTER, flechas Press/Release más lentas; botón grande para OK. Puntero experimental en Samsung y puntero webOS en LG. Compatibilidad física pendiente de verificar." \
            --target "$GITHUB_SHA"